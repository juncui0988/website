<!DOCTYPE html>
<html>
<head>
    <title>Clicker Leaderboard</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        h1 { font-size: 80px; margin: 20px 0; color: #333; }
        
        .click-btn { 
            padding: 20px 40px; font-size: 24px; background-color: #007bff; 
            color: white; border: none; border-radius: 8px; cursor: pointer; 
            box-shadow: 0 4px #0056b3; transform: translateY(0);
        }
        .click-btn:active { transform: translateY(4px); box-shadow: none; }

        .logout { position: absolute; top: 20px; right: 20px; color: red; text-decoration: none; }

        table { margin: 50px auto; border-collapse: collapse; width: 300px; background: white; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; }
        th { background-color: #333; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <a href="/logout" class="logout">Logout</a>

    <h2>Welcome, {{ user.username }}!</h2>
    
    <!-- User Score -->
    <h1>{{ user.clicks }}</h1>

    <!-- Click Button -->
    <form action="/click" method="POST">
        <button type="submit" class="click-btn">CLICK!</button>
    </form>

    <!-- Leaderboard -->
    <h3>🏆 Top 10 Clickers 🏆</h3>
    <table>
        <tr>
            <th>Rank</th>
            <th>User</th>
            <th>Clicks</th>
        </tr>
        {% for player in leaderboard %}
        <tr>
            <td>#{{ loop.index }}</td>
            <td>{{ player.username }}</td>
            <td>{{ player.clicks }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
