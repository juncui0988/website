<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        h1 { font-size: 80px; margin: 20px 0; }
        button {
            padding: 20px 40px; font-size: 24px;
            background-color: #007bff; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); } /* Visual effect when clicking */
        table { margin: 50px auto; border-collapse: collapse; width: 300px; background: white; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; }
        th { background-color: #333; color: white; }
        .logout { color: red; float: right; text-decoration: none; font-weight: bold;}
    </style>
</head>
<body>
    <a href="/logout" class="logout">Logout</a>
    <h2>Player: {{ user.username }}</h2>

    <!-- 1. Give the Score an ID so JavaScript can find it -->
    <h1 id="scoreDisplay">{{ user.clicks }}</h1>

    <!-- 2. Remove the <form> tag. Just use a regular button with an ID -->
    <button id="clickBtn">CLICK!</button>

    <h3>🏆 Leaderboard 🏆</h3>
    <p style="font-size: 12px; color: #666;">(Refresh page to update leaderboard)</p>
    <table>
        <tr><th>Rank</th><th>User</th><th>Clicks</th></tr>
        {% for player in leaderboard %}
        <tr>
            <td>#{{ loop.index }}</td>
            <td>{{ player.username }}</td>
            <td>{{ player.clicks }}</td>
        </tr>
        {% endfor %}
    </table>

    <!-- 3. The Magic JavaScript -->
    <script>
        const button = document.getElementById('clickBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');

        button.addEventListener('click', function() {
            // Send a secret message to Python
            fetch('/click', {
                method: 'POST'
            })
            .then(response => response.json()) // Read the JSON response
            .then(data => {
                // Update the number on the screen instantly
                if (data.clicks) {
                    scoreDisplay.innerText = data.clicks;
                }
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
